<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>h2Radnor · RNS Monitor</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <style>
    :root {
      /* Terminal-density palette — slightly neutralised from the previous green-tinted blacks */
      --bg-primary: #07090a;       /* outermost background */
      --bg-sidebar: #0b0f10;       /* left filter rail */
      --bg-toolbar: #0a0e0f;       /* top status strip */
      --bg-card: #0e1314;          /* announcement row */
      --bg-card-hover: #131a1c;
      --bg-card-active: #16201f;   /* expanded card */
      --bg-surface: #0c1112;       /* misc panels */
      --bg-detail: #0a0e0f;
      --border: #1a2326;
      --border-strong: #243036;
      --border-active: #2d4a36;
      --text-primary: #d4dcd6;
      --text-secondary: #7a8c80;
      --text-muted: #4a5a52;
      --text-dim: #34423b;
      --accent: #3db86a;
      --accent-dim: #2a7d49;
      --accent-glow: rgba(61,184,106,0.10);
      --watchlist: #f0c040;
      --watchlist-bg: rgba(240,192,64,0.06);
      --watchlist-border: rgba(240,192,64,0.22);
      --core: #f0c040;
      --readacross: #f97316;
      --readacross-bg: rgba(249,115,22,0.06);
      /* Category accent colours, kept restrained.
         Note: --director and --regulatory deliberately avoid gold and orange, because those
         are reserved for the core (gold) and read-across (orange) tier highlights. */
      --results: #5ba8f7;
      --trading: #a78bfa;
      --ma: #f97066;
      --fundraise: #34d399;
      --director: #a8a29e;
      --company-update: #60a5fa;
      --contract: #2dd4bf;
      --board-change: #c084fc;
      --regulatory: #f43f5e;
      --dividend: #a3e635;
      --shareholding: #f472b6;
      --buyback: #22d3ee;
      --admin: #94a3b8;
      --nonreg: #38bdf8;
      --other: #8a9e8f;
      --danger: #ef4444;
      --new-cue: #3db86a;
      --font-sans: 'DM Sans', -apple-system, sans-serif;
      --font-mono: 'JetBrains Mono', ui-monospace, SFMono-Regular, monospace;
      --sidebar-w: 224px;
      --toolbar-h: 48px;
    }

    /* Light theme. Applied by setting data-theme="light" on <html>. Every colour token is
       re-pointed, so components need no theme-specific code of their own. Category hues are
       darkened for legible contrast on white. */
    html[data-theme="light"] {
      --bg-primary: #f1f4f3;
      --bg-sidebar: #e8eceb;
      --bg-toolbar: #ffffff;
      --bg-card: #ffffff;
      --bg-card-hover: #f4f8f6;
      --bg-card-active: #ecf5f0;
      --bg-surface: #f7f9f8;
      --bg-detail: #fafbfa;
      --border: #d7dedb;
      --border-strong: #b9c4bf;
      --border-active: #8cbf9f;
      --text-primary: #14201b;
      --text-secondary: #4a5c53;
      --text-muted: #74847c;
      --text-dim: #9aa6a0;
      --accent: #1f8a4c;
      --accent-dim: #166638;
      --accent-glow: rgba(31,138,76,0.10);
      --watchlist: #a67608;
      --watchlist-bg: rgba(166,118,8,0.09);
      --watchlist-border: rgba(166,118,8,0.30);
      --core: #a67608;
      --readacross: #c2410c;
      --readacross-bg: rgba(194,65,12,0.08);
      --results: #1d6fd0;
      --trading: #6d3fd4;
      --ma: #cf3527;
      --fundraise: #0f8a5f;
      --director: #6f6a66;
      --company-update: #2563eb;
      --contract: #0d8f86;
      --board-change: #7c33c8;
      --regulatory: #d01b3c;
      --dividend: #4d7c0f;
      --shareholding: #be1873;
      --buyback: #0e7490;
      --admin: #5c6b78;
      --nonreg: #0369a1;
      --other: #6b7280;
      --danger: #dc2626;
      --new-cue: #1f8a4c;
    }
    * { margin:0; padding:0; box-sizing:border-box; }
    html, body { background:var(--bg-primary); color:var(--text-primary); font-family:var(--font-sans); min-height:100vh; }
    body { font-size:13px; line-height:1.4; -webkit-font-smoothing:antialiased; }
    ::-webkit-scrollbar { width:8px; height:8px; }
    ::-webkit-scrollbar-track { background:transparent; }
    ::-webkit-scrollbar-thumb { background:var(--border); border-radius:0; }
    ::-webkit-scrollbar-thumb:hover { background:var(--border-strong); }

    @keyframes fadeIn { from{opacity:0} to{opacity:1} }
    @keyframes pulse-dot { 0%,100%{opacity:1} 50%{opacity:0.35} }
    @keyframes shimmer { 0%{background-position:-200% 0} 100%{background-position:200% 0} }
    @keyframes spin { to{transform:rotate(360deg)} }
    @keyframes slideInLeft { from{transform:translateX(-100%)} to{transform:translateX(0)} }
    .fade-in { animation:fadeIn 0.18s ease-out both; }
    .fade-up { animation:fadeIn 0.22s ease-out both; }  /* legacy alias, kept for older components */
    .skeleton { background:linear-gradient(90deg,var(--bg-card) 25%,var(--bg-card-hover) 50%,var(--bg-card) 75%); background-size:200% 100%; animation:shimmer 1.8s ease-in-out infinite; }
    .spinner { width:14px; height:14px; border:1.5px solid var(--border); border-top-color:var(--accent); border-radius:50%; animation:spin 0.6s linear infinite; display:inline-block; }

    /* Top toolbar */
    .toolbar { position:sticky; top:0; z-index:50; height:var(--toolbar-h); background:var(--bg-toolbar); border-bottom:1px solid var(--border); display:flex; align-items:center; padding:0 14px; gap:14px; }
    .brand { font-size:14px; font-weight:700; letter-spacing:-0.02em; }
    .brand span { color:var(--accent); }
    .toolbar-tag { font-family:var(--font-mono); font-size:9px; font-weight:700; letter-spacing:0.12em; text-transform:uppercase; color:var(--text-muted); padding:2px 8px; border:1px solid var(--border); border-radius:0; }
    .toolbar-meta { font-family:var(--font-mono); font-size:11px; color:var(--text-muted); }
    .toolbar-spacer { flex:1; }
    .toolbar-btn { background:transparent; border:1px solid var(--border); color:var(--text-secondary); font-family:var(--font-sans); font-size:11px; font-weight:500; padding:6px 12px; cursor:pointer; transition:all 0.15s; }
    .toolbar-btn:hover { border-color:var(--accent); color:var(--accent); }
    .toolbar-btn.primary { background:var(--accent); color:var(--bg-primary); border-color:var(--accent); font-weight:600; }
    .toolbar-btn.primary:hover { background:var(--accent-dim); border-color:var(--accent-dim); color:var(--bg-primary); }
    .toolbar-btn.icon { padding:5px 9px; display:inline-flex; align-items:center; justify-content:center; }
    .toolbar-btn.icon svg { display:block; }
    .toolbar-tab { background:transparent; border:none; color:var(--text-muted); font-family:var(--font-sans); font-size:12px; font-weight:600; padding:14px 14px; cursor:pointer; border-bottom:2px solid transparent; margin-bottom:-1px; height:100%; display:flex; align-items:center; }
    .toolbar-tab.active { color:var(--accent); border-bottom-color:var(--accent); }
    .toolbar-tab:hover { color:var(--text-secondary); }

    /* Layout grid */
    .layout { display:grid; grid-template-columns:var(--sidebar-w) 1fr; min-height:calc(100vh - var(--toolbar-h)); }

    /* Mobile toolbar bits */
    .toolbar-icon-btn { background:transparent; border:1px solid var(--border); color:var(--text-secondary); font-size:16px; line-height:1; padding:8px 11px; cursor:pointer; transition:all 0.15s; }
    .toolbar-icon-btn:hover { border-color:var(--accent); color:var(--accent); }

    /* Mobile tab bar (under toolbar) */
    .mobile-tabbar { position:sticky; top:var(--toolbar-h); z-index:45; display:flex; background:var(--bg-toolbar); border-bottom:1px solid var(--border); }
    .mobile-tab { flex:1; text-align:center; padding:13px 8px; font-size:13px; font-weight:600; color:var(--text-muted); background:transparent; border:none; border-bottom:2px solid transparent; cursor:pointer; }
    .mobile-tab.active { color:var(--accent); border-bottom-color:var(--accent); }

    /* Scrim + drawer + overflow menu */
    .scrim { position:fixed; inset:0; background:rgba(0,0,0,0.6); z-index:90; animation:fadeIn 0.18s ease-out both; }
    .scrim.clear { background:transparent; }
    .drawer { position:fixed; top:0; bottom:0; left:0; width:min(86%,330px); background:var(--bg-sidebar); border-right:1px solid var(--border); z-index:91; display:flex; flex-direction:column; animation:slideInLeft 0.2s ease-out both; }
    .drawer-head { padding:14px; border-bottom:1px solid var(--border); display:flex; align-items:center; justify-content:space-between; flex-shrink:0; }
    .drawer-head-title { font-family:var(--font-mono); font-size:11px; font-weight:700; letter-spacing:0.12em; text-transform:uppercase; color:var(--text-secondary); }
    .drawer-body { flex:1; overflow-y:auto; padding:14px 12px; }
    .overflow-menu { position:fixed; top:calc(var(--toolbar-h) + 4px); right:8px; width:230px; background:var(--bg-card); border:1px solid var(--border-strong); z-index:91; animation:fadeIn 0.14s ease-out both; }
    .overflow-item { display:flex; align-items:center; justify-content:space-between; padding:14px; font-size:13px; color:var(--text-secondary); cursor:pointer; border-bottom:1px solid var(--border); }
    .overflow-item:last-child { border-bottom:none; }
    .overflow-item:active, .overflow-item:hover { background:var(--bg-card-hover); color:var(--text-primary); }
    .overflow-val { font-family:var(--font-mono); font-size:11px; color:var(--text-muted); }

    /* Bigger touch targets inside the drawer (no hover on touch) */
    .drawer .filter-row { padding:11px 8px; }
    .drawer .sidebar-search { padding:11px 12px; font-size:14px; }
    .drawer .filter-toggle-hide { opacity:1; padding:4px 8px; font-size:13px; }

    @media (max-width: 880px) { .layout { grid-template-columns: 1fr; } }
    /* Tighten side padding on small screens; allow grid to drop to one column naturally */
    @media (max-width: 560px) { .main { padding:12px 12px 60px; } .toolbar { padding:0 10px; gap:8px; } }

    /* Sidebar */
    .sidebar { background:var(--bg-sidebar); border-right:1px solid var(--border); padding:14px 12px; overflow-y:auto; max-height:calc(100vh - var(--toolbar-h)); position:sticky; top:var(--toolbar-h); align-self:start; }
    .sidebar-section { margin-bottom:18px; }
    .sidebar-label { font-family:var(--font-mono); font-size:9px; font-weight:700; letter-spacing:0.14em; text-transform:uppercase; color:var(--text-muted); margin-bottom:6px; padding:0 4px; display:flex; align-items:center; justify-content:space-between; }
    .sidebar-search { width:100%; background:var(--bg-surface); border:1px solid var(--border); color:var(--text-primary); font-family:var(--font-sans); font-size:12px; padding:7px 10px; outline:none; transition:border-color 0.15s; }
    .sidebar-search::placeholder { color:var(--text-muted); }
    .sidebar-search:focus { border-color:var(--accent); }
    .filter-row { display:flex; align-items:center; justify-content:space-between; padding:5px 8px; cursor:pointer; color:var(--text-secondary); font-size:12px; transition:all 0.12s; user-select:none; border-left:2px solid transparent; }
    .filter-row:hover { background:var(--bg-card-hover); color:var(--text-primary); }
    .filter-row.active { background:var(--bg-card-active); color:var(--accent); border-left-color:var(--accent); }
    .filter-row.active .filter-count { color:var(--accent); background:var(--accent-glow); }
    .filter-row.excluded { color:var(--danger); border-left-color:rgba(239,68,68,0.4); }
    .filter-row.excluded .filter-label { text-decoration:line-through; }
    .filter-label { display:flex; align-items:center; gap:6px; }
    .filter-dot { width:6px; height:6px; border-radius:50%; flex-shrink:0; }
    .filter-count { font-family:var(--font-mono); font-size:10px; color:var(--text-muted); background:var(--bg-surface); padding:1px 6px; min-width:24px; text-align:center; }
    .filter-toggle-hide { opacity:0; padding:2px 6px; margin-left:4px; color:var(--text-muted); font-size:10px; transition:opacity 0.12s; }
    .filter-row:hover .filter-toggle-hide { opacity:1; }
    .filter-toggle-hide:hover { color:var(--danger); }

    /* Main feed */
    .main { padding:14px 16px 60px; overflow-x:hidden; }
    .feed-header { display:flex; align-items:center; justify-content:space-between; margin-bottom:12px; padding:0 2px; }
    .feed-counts { display:flex; gap:14px; font-family:var(--font-mono); font-size:11px; color:var(--text-muted); }
    .feed-counts span strong { color:var(--text-secondary); font-weight:500; }

    /* Grid.
       align-items:start is important: without it, grid items stretch to the tallest in their
       row, so expanding one card inflated its neighbour into a tall empty box. */
    .grid { display:grid; grid-template-columns:repeat(auto-fill, minmax(380px, 1fr)); gap:8px; align-items:start; }
    .grid.cols-1 { grid-template-columns:1fr; }
    .grid.cols-2 { grid-template-columns:repeat(2, minmax(0, 1fr)); }
    /* Matches the 880px breakpoint the JS uses for mobile layout, and minmax(0,...) lets a
       column shrink below its content width instead of forcing the page wider. */
    @media (max-width: 880px) { .grid, .grid.cols-1, .grid.cols-2 { grid-template-columns:minmax(0, 1fr); } }

    /* Announcement row — dense */
    .row { background:var(--bg-card); border:1px solid var(--border); border-left:3px solid var(--border); cursor:pointer; transition:background-color 0.12s, border-color 0.12s; padding:9px 12px; }
    .row:hover { background:var(--bg-card-hover); border-left-color:var(--accent-dim); }
    .row.expanded { background:var(--bg-card-active); border-color:var(--border-strong); border-left-color:var(--accent); }
    .row.watchlist { border-left-color:var(--watchlist); background:var(--watchlist-bg); }
    .row.watchlist:hover { background:rgba(240,192,64,0.10); }
    /* Read-across rows: orange highlight, distinct from the gold of core watchlist rows */
    .row.readacross { border-left-color:var(--readacross); background:var(--readacross-bg); }
    .row.readacross:hover { background:rgba(249,115,22,0.11); }
    /* Read rows: the CONTENT dims, not the whole row, so the gold/orange tier bar on the left
       keeps its full strength and a read watchlist item is still identifiable at a glance.
       Hovering restores full opacity so re-reading is easy. */
    .row.read .row-body { opacity:0.45; }
    .row.read:hover .row-body { opacity:1; }
    .row-body { transition:opacity 0.12s; }
    /* New since the last refresh: a small accent flag plus a brief pulse on arrival. */
    .row.is-new { box-shadow:inset 0 0 0 1px var(--accent-glow); }
    .row.is-new .row-new-dot { display:inline-block; }
    .row-new-dot { display:none; width:5px; height:5px; border-radius:50%; background:var(--new-cue); flex-shrink:0; animation:pulse-dot 2s ease-in-out 3; }
    /* Keyboard focus ring for j/k navigation. */
    .row.focused { outline:1px solid var(--accent); outline-offset:-1px; }
    .row:focus-visible { outline:1px solid var(--accent); outline-offset:-1px; }
    .row-read-btn { background:transparent; border:none; color:var(--text-dim); cursor:pointer; font-size:10px; padding:0 2px; line-height:1; flex-shrink:0; transition:color 0.12s; }
    .row-read-btn:hover { color:var(--accent); }
    .row-ra-map { font-family:var(--font-mono); font-size:9px; color:var(--readacross); background:var(--readacross-bg); padding:1px 5px; flex-shrink:0; }
    /* The meta line must be allowed to wrap. Every child is flex-shrink:0, so with nowrap the
       contents overflowed the card on narrow screens and .main's overflow-x:hidden silently
       clipped the right-hand end (category chip, read toggle, chevron). The tags now wrap onto a
       second line while the controls stay pinned top-right. */
    .row-meta { display:flex; align-items:flex-start; gap:8px; margin-bottom:3px; font-size:10px; flex-wrap:wrap; }
    .row-meta-tags { display:flex; align-items:center; flex-wrap:wrap; gap:8px; row-gap:4px; flex:1 1 auto; min-width:0; }
    .row-meta-ctrl { display:flex; align-items:center; gap:6px; flex-shrink:0; margin-left:auto; }
    .row-time { font-family:var(--font-mono); font-size:10px; color:var(--text-muted); font-weight:500; flex-shrink:0; }
    .row-ticker { font-family:var(--font-mono); font-size:10px; font-weight:700; color:var(--accent); letter-spacing:0.02em; flex-shrink:0; }
    .row-ticker.watchlist { color:var(--watchlist); }
    .row-ticker.readacross { color:var(--readacross); }
    .row-tag { font-size:9px; font-weight:700; letter-spacing:0.08em; text-transform:uppercase; padding:1px 6px; border-radius:0; flex-shrink:0; }
    .row-tag.tier-core { background:rgba(240,192,64,0.12); color:var(--core); }
    .row-tag.tier-ra { background:rgba(249,115,22,0.12); color:var(--readacross); }
    .row-category { font-family:var(--font-mono); font-size:9px; font-weight:600; letter-spacing:0.06em; text-transform:uppercase; padding:1px 6px; flex-shrink:1; min-width:0; max-width:100%; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
    .row-source { font-family:var(--font-mono); font-size:9px; color:var(--text-muted); border:1px solid var(--border); padding:0 4px; flex-shrink:0; }
    .row-spacer { flex:1; }
    .row-chevron { color:var(--text-dim); font-size:9px; transition:transform 0.15s; flex-shrink:0; }
    .row.expanded .row-chevron { transform:rotate(180deg); color:var(--accent); }
    .row-company { font-size:11px; color:var(--text-secondary); font-weight:500; margin-bottom:2px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
    .row-headline { font-size:13px; color:var(--text-primary); line-height:1.35; font-weight:500; word-wrap:break-word; overflow-wrap:anywhere; }

    /* Expanded panel */
    .expand { border-top:1px solid var(--border); padding:12px 14px; background:var(--bg-detail); overflow-wrap:anywhere; }
    .expand-section { margin-bottom:14px; }
    .expand-label { font-family:var(--font-mono); font-size:9px; font-weight:700; letter-spacing:0.12em; text-transform:uppercase; color:var(--text-muted); margin-bottom:6px; }
    .expand-summary { font-size:12px; color:var(--text-primary); line-height:1.65; }
    .key-figure { display:block; padding:6px 10px; margin:0 0 4px 0; background:rgba(61,184,106,0.05); border-left:2px solid rgba(61,184,106,0.25); font-size:11px; color:var(--accent); line-height:1.5; word-wrap:break-word; font-family:var(--font-mono); }
    .detail-body { font-size:11px; line-height:1.6; color:var(--text-secondary); white-space:normal; word-wrap:break-word; max-height:400px; overflow-y:auto; padding:6px 0; font-family:var(--font-sans); }
    .detail-body p { margin:0 0 8px 0; }
    .expand-link { display:inline-flex; align-items:center; gap:4px; font-size:11px; color:var(--text-secondary); text-decoration:none; padding:5px 10px; border:1px solid var(--border); transition:all 0.15s; }
    .expand-link:hover { color:var(--accent); border-color:var(--accent); }
    .expand-toggle { display:inline-flex; align-items:center; gap:6px; font-size:11px; color:var(--text-secondary); background:transparent; border:1px solid var(--border); padding:5px 10px; cursor:pointer; font-family:var(--font-sans); transition:all 0.15s; }
    .expand-toggle:hover { border-color:var(--accent); color:var(--accent); }

    /* Read-across tab styling kept consistent with terminal feel */
    .ra-grid { background:var(--bg-card); border:1px solid var(--border); overflow:auto; }
    .ra-grid table { border-collapse:collapse; width:100%; font-size:11px; }
    .ra-grid th, .ra-grid td { border-right:1px solid var(--border); border-bottom:1px solid var(--border); padding:6px 8px; }

    /* Empty / error states */
    .empty { text-align:center; padding:60px 20px; background:var(--bg-card); border:1px solid var(--border); color:var(--text-muted); font-size:13px; }

    /* ── Active filter chips ────────────────────────────────────────────────
       Shows what is currently narrowing the feed, so an unexpectedly short list always has a
       visible explanation. Matters most on mobile, where the sidebar is hidden in a drawer. */
    .chips { display:flex; flex-wrap:wrap; gap:6px; margin-bottom:10px; }
    .chip { display:inline-flex; align-items:center; gap:6px; font-size:10px; font-family:var(--font-mono); letter-spacing:0.04em; text-transform:uppercase; color:var(--text-secondary); background:var(--bg-surface); border:1px solid var(--border); padding:3px 8px; }
    .chip-x { cursor:pointer; color:var(--text-muted); font-size:11px; line-height:1; }
    .chip-x:hover { color:var(--danger); }
    .chip.clear-all { cursor:pointer; border-color:var(--border-strong); color:var(--text-muted); }
    .chip.clear-all:hover { border-color:var(--accent); color:var(--accent); }

    /* ── Options panel ──────────────────────────────────────────────────────
       Centred dialog on desktop, bottom sheet on mobile. */
    .sheet-wrap { position:fixed; inset:0; z-index:1000; background:rgba(0,0,0,0.7); display:flex; align-items:center; justify-content:center; backdrop-filter:blur(4px); }
    .sheet { background:var(--bg-card); border:1px solid var(--border-strong); width:100%; max-width:520px; max-height:84vh; overflow:auto; margin:20px; }
    .sheet-head { position:sticky; top:0; background:var(--bg-card); display:flex; align-items:center; justify-content:space-between; padding:16px 18px; border-bottom:1px solid var(--border); z-index:2; }
    .sheet-title { font-size:15px; font-weight:600; }
    .sheet-body { padding:6px 18px 18px; }
    /* Shared close button for sheet and panel headers */
