<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>h2Radnor · RNS Monitor</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.9/babel.min.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg-primary: #0a0f0d; --bg-card: #111a15; --bg-card-hover: #162019;
      --bg-surface: #0e1511; --bg-detail: #0d1610;
      --border: #1e2e24; --border-active: #2d4a36;
      --text-primary: #e8ede9; --text-secondary: #8a9e8f; --text-muted: #5a6e5f;
      --accent: #3db86a; --accent-dim: #2a7d49; --accent-glow: rgba(61,184,106,0.12);
      --watchlist: #f0c040; --watchlist-bg: rgba(240,192,64,0.08);
      --results: #5ba8f7; --trading: #a78bfa; --ma: #f97066; --fundraise: #34d399;
      --director: #fbbf24; --company-update: #60a5fa; --contract: #2dd4bf;
      --board-change: #c084fc; --regulatory: #fb923c; --dividend: #a3e635;
      --other: #8a9e8f; --danger: #ef4444;
      --font-sans: 'DM Sans', -apple-system, sans-serif;
      --font-mono: 'JetBrains Mono', monospace;
    }
    * { margin:0; padding:0; box-sizing:border-box; }
    body { background:var(--bg-primary); color:var(--text-primary); font-family:var(--font-sans); min-height:100vh; }
    ::-webkit-scrollbar { width:6px; }
    ::-webkit-scrollbar-track { background:var(--bg-primary); }
    ::-webkit-scrollbar-thumb { background:var(--border); border-radius:3px; }
    @keyframes fadeUp { from{opacity:0;transform:translateY(12px)} to{opacity:1;transform:translateY(0)} }
    @keyframes pulse-dot { 0%,100%{opacity:1} 50%{opacity:0.4} }
    @keyframes shimmer { 0%{background-position:-200% 0} 100%{background-position:200% 0} }
    @keyframes spin { to{transform:rotate(360deg)} }
    .fade-up { animation:fadeUp 0.4s ease-out both; }
    .skeleton { background:linear-gradient(90deg,var(--bg-card) 25%,var(--bg-card-hover) 50%,var(--bg-card) 75%); background-size:200% 100%; animation:shimmer 1.8s ease-in-out infinite; border-radius:6px; }
    .spinner { width:16px; height:16px; border:2px solid var(--border); border-top-color:var(--accent); border-radius:50%; animation:spin 0.6s linear infinite; display:inline-block; }
    .detail-body { font-size:13px; line-height:1.75; color:var(--text-secondary); white-space:pre-wrap; word-wrap:break-word; max-height:500px; overflow-y:auto; padding:12px 0; }
    .detail-body::-webkit-scrollbar { width:4px; }
    .detail-body::-webkit-scrollbar-thumb { background:var(--border); border-radius:2px; }
    .key-figure { display:block; padding:8px 12px; margin:0 0 6px 0; background:rgba(61,184,106,0.06); border:1px solid rgba(61,184,106,0.12); border-radius:8px; font-size:12px; color:var(--accent); line-height:1.6; word-wrap:break-word; }
  </style>
</head>
<body>
  <div id="root"></div>
  <script type="text/babel">
    const { useState, useEffect, useCallback, useRef } = React;
    const API_BASE = "";

    const CATEGORY_COLORS = {
      "Results":          { color:"var(--results)",        bg:"rgba(91,168,247,0.10)" },
      "Trading Update":   { color:"var(--trading)",        bg:"rgba(167,139,250,0.10)" },
      "Company Update":   { color:"var(--company-update)", bg:"rgba(96,165,250,0.10)" },
      "M&A":              { color:"var(--ma)",             bg:"rgba(249,112,102,0.10)" },
      "Contract":         { color:"var(--contract)",       bg:"rgba(45,212,191,0.10)" },
      "Fundraise":        { color:"var(--fundraise)",      bg:"rgba(52,211,153,0.10)" },
      "Board Change":     { color:"var(--board-change)",   bg:"rgba(192,132,252,0.10)" },
      "Director Dealing": { color:"var(--director)",       bg:"rgba(251,191,36,0.10)" },
      "Shareholding":     { color:"#f472b6",               bg:"rgba(244,114,182,0.10)" },
      "Regulatory":       { color:"var(--regulatory)",     bg:"rgba(251,146,60,0.10)" },
      "Dividend":         { color:"var(--dividend)",       bg:"rgba(163,230,53,0.10)" },
      "Non-Reg":          { color:"#38bdf8",               bg:"rgba(56,189,248,0.10)" },
      "Other":            { color:"var(--other)",          bg:"rgba(138,158,143,0.08)" },
    };

    function StatusDot({status}) {
      const c = {connected:"var(--accent)",loading:"var(--watchlist)",error:"var(--danger)",idle:"var(--text-muted)"};
      return <span style={{display:"inline-block",width:8,height:8,borderRadius:"50%",background:c[status]||c.idle,animation:status==="loading"?"pulse-dot 1.2s infinite":"none",marginRight:8,flexShrink:0}}/>;
    }

    function FilterPill({label,active,onClick,count}) {
      return <button onClick={onClick} style={{display:"inline-flex",alignItems:"center",gap:6,padding:"6px 14px",border:`1px solid ${active?"var(--accent)":"var(--border)"}`,borderRadius:20,background:active?"var(--accent-glow)":"transparent",color:active?"var(--accent)":"var(--text-secondary)",fontFamily:"var(--font-sans)",fontSize:13,fontWeight:500,cursor:"pointer",transition:"all 0.2s",whiteSpace:"nowrap"}}>
        {label}{count!==undefined&&<span style={{background:active?"var(--accent)":"var(--border)",color:active?"var(--bg-primary)":"var(--text-secondary)",fontSize:11,fontWeight:600,padding:"1px 7px",borderRadius:10,fontFamily:"var(--font-mono)"}}>{count}</span>}
      </button>;
    }

    function CategoryBadge({category}) {
      const cat = CATEGORY_COLORS[category]||CATEGORY_COLORS["Other"];
      return <span style={{padding:"2px 10px",borderRadius:12,background:cat.bg,color:cat.color,fontSize:11,fontWeight:600,letterSpacing:"0.03em",textTransform:"uppercase"}}>{category}</span>;
    }

    // ── Shareholding Summary Strip ──
    function ShareholdingStrip({data}) {
      if (!data) return null;

      // Check if structured data looks confident (both old and new pct present and different)
      const confident = data.old_pct !== null && data.new_pct !== null
        && data.old_pct !== data.new_pct && data.direction;
      const dir = data.direction;
      const dirColor = dir === "increase" ? "var(--accent)" : dir === "decrease" ? "var(--ma)" : "var(--text-muted)";
      const arrow = dir === "increase" ? "\u25B2" : dir === "decrease" ? "\u25BC" : "";
      const changePP = data.change_pp !== null && data.change_pp !== undefined
        ? `${data.change_pp > 0 ? "+" : ""}${data.change_pp.toFixed(2)}pp` : "";

      return (
        <div style={{
          marginTop:8, padding:"10px 16px",
          background:"rgba(244,114,182,0.06)",
          border:"1px solid rgba(244,114,182,0.12)",
          borderRadius:8,
        }}>
          {/* Structured badges — only when confident */}
          {confident && (
            <div style={{display:"flex", alignItems:"center", gap:8, flexWrap:"wrap", marginBottom: data.summary ? 8 : 0}}>
              {data.holder && <span style={{fontWeight:600, fontSize:13, color:"var(--text-primary)"}}>{data.holder}</span>}
              <span style={{fontFamily:"var(--font-mono)", fontSize:12, color:"var(--text-secondary)"}}>
                {data.old_pct.toFixed(2)}%
                <span style={{margin:"0 4px", color:"var(--text-muted)"}}>{"\u2192"}</span>
                <span style={{color: dirColor, fontWeight:600}}>{data.new_pct.toFixed(2)}%</span>
              </span>
              {changePP && (
                <span style={{
                  display:"inline-flex", alignItems:"center", gap:3,
                  padding:"2px 8px", borderRadius:10,
                  background: dir === "increase" ? "rgba(61,184,106,0.12)" : dir === "decrease" ? "rgba(249,112,102,0.12)" : "rgba(138,158,143,0.08)",
                  color: dirColor, fontSize:11, fontWeight:600, fontFamily:"var(--font-mono)",
                }}>{arrow} {changePP}</span>
              )}
              {data.voting_rights && (
                <span style={{fontSize:11, color:"var(--text-muted)", fontFamily:"var(--font-mono)"}}>{data.voting_rights} votes</span>
              )}
            </div>
          )}
          {/* Always show the AI summary text */}
          {data.summary && (
            <div style={{fontSize:12, color:"var(--text-secondary)", lineHeight:1.6}}>
              {data.summary}
            </div>
          )}
          {/* If no summary and no confident data, show what we have */}
          {!data.summary && !confident && data.holder && (
            <div style={{fontSize:12, color:"var(--text-secondary)"}}>
              {data.holder}{data.new_pct !== null ? ` — ${data.new_pct.toFixed(2)}%` : ""}
            </div>
          )}
        </div>
      );
    }

    // ── Full Text Toggle ──
    function FullTextToggle({text}) {
      const [showFull, setShowFull] = useState(false);
      if (!text || text === "Could not extract announcement body from the page.") return null;
      return (
        <div style={{marginBottom:16}}>
          <button onClick={(e)=>{e.stopPropagation();setShowFull(!showFull);}} style={{
            display:"inline-flex",alignItems:"center",gap:6,
            padding:"6px 14px",border:"1px solid var(--border)",borderRadius:8,
            background:"transparent",color:"var(--text-secondary)",
            fontFamily:"var(--font-sans)",fontSize:12,fontWeight:500,cursor:"pointer",
            transition:"all 0.2s",marginBottom:showFull?10:0,
          }}>
            {showFull ? "Hide full announcement" : "Show full announcement"}
            <span style={{fontSize:10,transition:"transform 0.2s",transform:showFull?"rotate(180deg)":"rotate(0)"}}>&#9660;</span>
          </button>
          {showFull && <div className="detail-body">{text}</div>}
        </div>
      );
    }

    // ── Expandable Announcement Card ──
    function AnnouncementCard({ann, index, backendUrl}) {
      const [expanded, setExpanded] = useState(false);
      const [detail, setDetail] = useState(null);
      const [loading, setLoading] = useState(false);
      const [error, setError] = useState(null);
      const [shData, setShData] = useState(null);
      const [shLoading, setShLoading] = useState(false);
      const shFetched = useRef(false);

      // Auto-fetch shareholding detail for Shareholding cards
      useEffect(() => {
        if (ann.category === "Shareholding" && ann.url && !shFetched.current) {
          shFetched.current = true;
          setShLoading(true);
          fetch(`${backendUrl}/api/rns/shareholding?url=${encodeURIComponent(ann.url)}`)
            .then(r => r.ok ? r.json() : null)
            .then(json => { if (json && !json.error) setShData(json); })
            .catch(() => {})
            .finally(() => setShLoading(false));
        }
      }, [ann.category, ann.url, backendUrl]);

      const fetchDetail = async () => {
        if (!ann.url) return;
        if (detail) { setExpanded(!expanded); return; }
        setExpanded(true);
        setLoading(true);
        setError(null);
        try {
          const resp = await fetch(`${backendUrl}/api/rns/detail?url=${encodeURIComponent(ann.url)}`);
          if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
          const json = await resp.json();
          if (json.error) throw new Error(json.error);
          setDetail(json);
        } catch (err) {
          setError(err.message);
        } finally {
          setLoading(false);
        }
      };

      const toggleExpand = () => {
        if (expanded) { setExpanded(false); }
        else { fetchDetail(); }
      };

      return (
        <div className="fade-up" style={{
          animationDelay:`${index*40}ms`,
          background:ann.is_watchlist?"var(--watchlist-bg)":"var(--bg-card)",
          border:`1px solid ${ann.is_watchlist?"rgba(240,192,64,0.20)":"var(--border)"}`,
          borderRadius:10, transition:"all 0.2s", overflow:"hidden",
        }}>
          {/* Header — always visible, clickable */}
          <div style={{padding:"16px 20px", cursor:"pointer"}} onClick={toggleExpand}
            onMouseOver={e=>{e.currentTarget.style.background=ann.is_watchlist?"rgba(240,192,64,0.12)":"var(--bg-card-hover)"}}
            onMouseOut={e=>{e.currentTarget.style.background="transparent"}}>

            <div style={{display:"flex",alignItems:"center",gap:8,marginBottom:10,flexWrap:"wrap"}}>
              <span style={{fontFamily:"var(--font-mono)",fontSize:12,color:"var(--text-muted)",fontWeight:500}}>{ann.time}</span>
              <CategoryBadge category={ann.category} />
              {ann.is_watchlist&&<span style={{padding:"2px 10px",borderRadius:12,background:"rgba(240,192,64,0.15)",color:"var(--watchlist)",fontSize:11,fontWeight:600,letterSpacing:"0.03em"}}>WATCHLIST</span>}
              {ann.ticker&&<span style={{padding:"2px 8px",borderRadius:6,background:"var(--bg-surface)",border:"1px solid var(--border)",color:"var(--text-secondary)",fontSize:11,fontFamily:"var(--font-mono)",fontWeight:500}}>{ann.ticker}</span>}
              {ann.source_feed&&ann.source_feed!=="RNS"&&<span style={{padding:"2px 6px",borderRadius:4,fontSize:10,fontFamily:"var(--font-mono)",color:"var(--text-muted)",border:"1px solid var(--border)"}}>{ann.source_feed}</span>}
              <span style={{marginLeft:"auto",fontSize:11,color:"var(--text-muted)",transition:"transform 0.2s",transform:expanded?"rotate(180deg)":"rotate(0)"}}>&#9660;</span>
            </div>

            <div style={{fontSize:15,fontWeight:600,color:"var(--text-primary)",marginBottom:4}}>{ann.company}</div>
            <div style={{fontSize:13,color:"var(--text-secondary)",lineHeight:1.5}}>{ann.headline}</div>

            {/* Shareholding summary strip — shown inline without expanding */}
            {ann.category === "Shareholding" && shLoading && (
              <div style={{display:"flex",alignItems:"center",gap:8,marginTop:8}}>
                <span className="spinner" style={{width:12,height:12,borderWidth:1.5}}></span>
                <span style={{fontSize:11,color:"var(--text-muted)"}}>Loading shareholding data...</span>
              </div>
            )}
            {ann.category === "Shareholding" && shData && <ShareholdingStrip data={shData} />}
          </div>

          {/* Expanded Detail Panel */}
          {expanded && (
            <div style={{
              borderTop:`1px solid ${ann.is_watchlist?"rgba(240,192,64,0.15)":"var(--border)"}`,
              padding:"16px 20px",
              background:"var(--bg-detail)",
            }}>
              {loading && (
                <div style={{display:"flex",alignItems:"center",gap:10,padding:"16px 0"}}>
                  <span className="spinner"></span>
                  <span style={{fontSize:13,color:"var(--text-muted)"}}>Fetching full announcement...</span>
                </div>
              )}

              {error && (
                <div style={{padding:"12px",background:"rgba(239,68,68,0.08)",border:"1px solid rgba(239,68,68,0.2)",borderRadius:8,fontSize:13,color:"var(--danger)",marginBottom:12}}>
                  Failed to load: {error}
                </div>
              )}

              {detail && !loading && (
                <div>
                  {/* AI Summary — prominent at top */}
                  {detail.ai_summary && (
                    <div style={{
                      marginBottom:16, padding:"12px 16px",
                      background:"var(--bg-surface)",
                      border:"1px solid var(--border)",
                      borderRadius:8,
                    }}>
                      <div style={{fontSize:12,fontWeight:600,color:"var(--text-muted)",marginBottom:6,textTransform:"uppercase",letterSpacing:"0.06em"}}>Summary</div>
                      <div style={{fontSize:14,color:"var(--text-primary)",lineHeight:1.7}}>{detail.ai_summary}</div>
                    </div>
                  )}

                  {/* Key Figures */}
                  {detail.key_figures && detail.key_figures.length > 0 && (
                    <div style={{marginBottom:16}}>
                      <div style={{fontSize:12,fontWeight:600,color:"var(--text-muted)",marginBottom:8,textTransform:"uppercase",letterSpacing:"0.06em"}}>Key figures</div>
                      <div style={{display:"flex",flexDirection:"column",gap:0}}>
                        {detail.key_figures.map((fig,i) => (
                          <span key={i} className="key-figure">{fig}</span>
                        ))}
                      </div>
                    </div>
                  )}

                  {/* Full Announcement — collapsed by default with show/hide toggle */}
                  <FullTextToggle text={detail.body_text} />

                  {/* Actions */}
                  <div style={{display:"flex",gap:10,alignItems:"center",paddingTop:12,borderTop:"1px solid var(--border)"}}>
                    {ann.url && (
                      <a href={ann.url} target="_blank" rel="noopener noreferrer" style={{
                        display:"inline-flex",alignItems:"center",gap:6,padding:"8px 14px",
                        border:"1px solid var(--border)",borderRadius:8,background:"transparent",
                        color:"var(--text-secondary)",fontFamily:"var(--font-sans)",fontSize:12,
                        fontWeight:500,textDecoration:"none",cursor:"pointer",transition:"all 0.2s",
                      }}
                      onMouseOver={e=>{e.target.style.borderColor="var(--accent)";e.target.style.color="var(--accent)"}}
                      onMouseOut={e=>{e.target.style.borderColor="var(--border)";e.target.style.color="var(--text-secondary)"}}
                      >View on Investegate &#8599;</a>
                    )}
                    <span style={{fontSize:11,color:"var(--text-muted)",fontFamily:"var(--font-mono)"}}>
                      Fetched {new Date(detail.fetched_at).toLocaleTimeString("en-GB")}
                    </span>
                  </div>
                </div>
              )}
            </div>
          )}
        </div>
      );
    }

    function SkeletonCard({index}) {
      return <div style={{background:"var(--bg-card)",border:"1px solid var(--border)",borderRadius:10,padding:"16px 20px"}}>
        <div style={{display:"flex",gap:8,marginBottom:12}}><div className="skeleton" style={{width:48,height:18}}/><div className="skeleton" style={{width:72,height:18}}/></div>
        <div className="skeleton" style={{width:"60%",height:16,marginBottom:8}}/><div className="skeleton" style={{width:"85%",height:14}}/>
      </div>;
    }

    function WatchlistModal({watchlist,onClose,onAdd,onRemove}) {
      const [ticker,setTicker]=useState("");const [name,setName]=useState("");const [sector,setSector]=useState("");
      const is={background:"var(--bg-surface)",border:"1px solid var(--border)",borderRadius:6,padding:"8px 12px",color:"var(--text-primary)",fontFamily:"var(--font-sans)",fontSize:13,outline:"none",width:"100%"};
      return <div style={{position:"fixed",inset:0,zIndex:1000,background:"rgba(0,0,0,0.7)",display:"flex",alignItems:"center",justifyContent:"center",backdropFilter:"blur(4px)"}} onClick={onClose}>
        <div onClick={e=>e.stopPropagation()} className="fade-up" style={{background:"var(--bg-card)",border:"1px solid var(--border)",borderRadius:14,padding:28,width:"100%",maxWidth:560,maxHeight:"80vh",overflow:"auto",margin:20}}>
          <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:20}}>
            <h2 style={{fontSize:18,fontWeight:600}}>Watchlist ({Object.keys(watchlist).length})</h2>
            <button onClick={onClose} style={{background:"none",border:"none",color:"var(--text-muted)",fontSize:20,cursor:"pointer"}}>&#10005;</button>
          </div>
          <div style={{display:"flex",flexDirection:"column",gap:6,marginBottom:20}}>
            {Object.entries(watchlist).map(([t,info])=><div key={t} style={{display:"flex",alignItems:"center",justifyContent:"space-between",padding:"8px 12px",background:"var(--bg-surface)",border:"1px solid var(--border)",borderRadius:8}}>
              <div style={{display:"flex",alignItems:"center",gap:10,flexWrap:"wrap"}}>
                <span style={{fontFamily:"var(--font-mono)",fontSize:12,fontWeight:600,color:"var(--accent)",background:"var(--accent-glow)",padding:"2px 8px",borderRadius:4}}>{t}</span>
                <span style={{fontSize:13,color:"var(--text-primary)"}}>{info.name}</span>
                <span style={{fontSize:11,color:"var(--text-muted)"}}>{info.sector}</span>
              </div>
              <button onClick={()=>onRemove(t)} style={{background:"none",border:"none",color:"var(--text-muted)",cursor:"pointer",fontSize:14,padding:"2px 6px"}}
                onMouseOver={e=>e.target.style.color="var(--danger)"} onMouseOut={e=>e.target.style.color="var(--text-muted)"}>&#10005;</button>
            </div>)}
          </div>
          <div style={{borderTop:"1px solid var(--border)",paddingTop:16,display:"flex",flexDirection:"column",gap:10}}>
            <div style={{fontSize:13,fontWeight:500,color:"var(--text-secondary)",marginBottom:4}}>Add to watchlist</div>
            <div style={{display:"flex",gap:8}}>
              <input value={ticker} onChange={e=>setTicker(e.target.value)} placeholder="Ticker" style={{...is,maxWidth:90,fontFamily:"var(--font-mono)"}}/>
              <input value={name} onChange={e=>setName(e.target.value)} placeholder="Company name" style={is}/>
            </div>
            <input value={sector} onChange={e=>setSector(e.target.value)} placeholder="Sector (optional)" style={is}/>
            <button onClick={()=>{if(ticker&&name){onAdd(ticker.toUpperCase(),name,sector);setTicker("");setName("");setSector("");}}} disabled={!ticker||!name} style={{background:ticker&&name?"var(--accent)":"var(--border)",color:ticker&&name?"var(--bg-primary)":"var(--text-muted)",border:"none",borderRadius:8,padding:"10px 16px",fontFamily:"var(--font-sans)",fontSize:13,fontWeight:600,cursor:ticker&&name?"pointer":"not-allowed"}}>Add company</button>
          </div>
        </div>
      </div>;
    }

    function App() {
      const [data,setData]=useState(null);const [status,setStatus]=useState("idle");
      const [filter,setFilter]=useState("all");const [categoryFilter,setCategoryFilter]=useState("all");
      const [autoRefresh,setAutoRefresh]=useState(false);const [showWatchlist,setShowWatchlist]=useState(false);
      const [watchlist,setWatchlist]=useState({});const [lastRefresh,setLastRefresh]=useState(null);
      const [backendUrl,setBackendUrl]=useState(API_BASE);const [configOpen,setConfigOpen]=useState(false);
      const [searchText,setSearchText]=useState("");const [sortMode,setSortMode]=useState("relevance");const intervalRef=useRef(null);

      const fetchData=useCallback(async()=>{
        setStatus("loading");
        try{const r=await fetch(`${backendUrl}/api/rns?include_all=true&limit=500`);if(!r.ok)throw new Error(`HTTP ${r.status}`);
          const j=await r.json();setData(j);setStatus("connected");setLastRefresh(new Date());
        }catch(e){console.error(e);setStatus("error");}
      },[backendUrl]);

      const fetchWatchlist=useCallback(async()=>{
        try{const r=await fetch(`${backendUrl}/api/watchlist`);if(r.ok){const j=await r.json();setWatchlist(j.watchlist||{});}}catch{}
      },[backendUrl]);

      useEffect(()=>{fetchData();fetchWatchlist();},[fetchData,fetchWatchlist]);
      useEffect(()=>{if(autoRefresh)intervalRef.current=setInterval(fetchData,120000);return()=>{if(intervalRef.current)clearInterval(intervalRef.current);};},[autoRefresh,fetchData]);

      const handleAdd=async(t,n,s)=>{try{await fetch(`${backendUrl}/api/watchlist/add?ticker=${t}&name=${encodeURIComponent(n)}&sector=${encodeURIComponent(s)}`,{method:"POST"});fetchWatchlist();}catch{}};
      const handleRemove=async(t)=>{try{await fetch(`${backendUrl}/api/watchlist/${t}`,{method:"DELETE"});fetchWatchlist();}catch{}};

      let anns=data?.announcements||[];
      if(filter==="watchlist")anns=anns.filter(a=>a.is_watchlist);
      if(filter==="sector")anns=anns.filter(a=>a.sector_relevant);
      if(categoryFilter!=="all")anns=anns.filter(a=>a.category===categoryFilter);
      if(searchText){const q=searchText.toLowerCase();anns=anns.filter(a=>a.company.toLowerCase().includes(q)||a.headline.toLowerCase().includes(q)||(a.ticker||"").toLowerCase().includes(q));}

      // Sort: relevance (default from backend) or latest-first by time
      if(sortMode==="latest"){
        anns=[...anns].sort((a,b)=>{
          if(a.time>b.time)return -1;
          if(a.time<b.time)return 1;
          return 0;
        });
      }

      const allAnns=data?.announcements||[];
      const wlCount=allAnns.filter(a=>a.is_watchlist).length;
      const secCount=allAnns.filter(a=>a.sector_relevant).length;
      const catCounts={};allAnns.forEach(a=>{catCounts[a.category]=(catCounts[a.category]||0)+1;});
      const sortedCats=Object.entries(catCounts).sort((a,b)=>b[1]-a[1]).map(([c])=>c);

      return <div style={{maxWidth:900,margin:"0 auto",padding:"32px 20px 60px"}}>
        <header className="fade-up" style={{marginBottom:32}}>
          <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:16,flexWrap:"wrap",gap:12}}>
            <div>
              <div style={{display:"flex",alignItems:"center",gap:10,marginBottom:4}}>
                <h1 style={{fontSize:22,fontWeight:700,letterSpacing:"-0.02em"}}><span style={{color:"var(--accent)"}}>h2</span>Radnor</h1>
                <span style={{fontSize:11,fontWeight:600,color:"var(--accent)",background:"var(--accent-glow)",padding:"3px 10px",borderRadius:12,letterSpacing:"0.08em",textTransform:"uppercase"}}>RNS Monitor</span>
              </div>
              <p style={{fontSize:13,color:"var(--text-muted)"}}>{data?.date||"Loading..."} · Investegate · Click any card to read the full RNS</p>
            </div>
            <div style={{display:"flex",alignItems:"center",gap:10}}>
              <StatusDot status={status}/>
              <span style={{fontSize:12,color:"var(--text-muted)",fontFamily:"var(--font-mono)"}}>{status==="connected"&&lastRefresh?`Updated ${lastRefresh.toLocaleTimeString("en-GB")}`:status}</span>
            </div>
          </div>
          <div style={{display:"flex",alignItems:"center",gap:8,flexWrap:"wrap",marginBottom:12}}>
            <button onClick={fetchData} disabled={status==="loading"} style={{display:"inline-flex",alignItems:"center",gap:6,padding:"8px 16px",background:"var(--accent)",color:"var(--bg-primary)",border:"none",borderRadius:8,fontFamily:"var(--font-sans)",fontSize:13,fontWeight:600,cursor:status==="loading"?"wait":"pointer",opacity:status==="loading"?0.6:1}}>{status==="loading"?"Scraping...":"Refresh"}</button>
            <button onClick={()=>setAutoRefresh(!autoRefresh)} style={{padding:"8px 14px",border:`1px solid ${autoRefresh?"var(--accent)":"var(--border)"}`,borderRadius:8,background:autoRefresh?"var(--accent-glow)":"transparent",color:autoRefresh?"var(--accent)":"var(--text-secondary)",fontFamily:"var(--font-sans)",fontSize:13,fontWeight:500,cursor:"pointer"}}>Auto {autoRefresh?"ON":"OFF"}</button>
            <button onClick={()=>setShowWatchlist(true)} style={{padding:"8px 14px",border:"1px solid var(--border)",borderRadius:8,background:"transparent",color:"var(--text-secondary)",fontFamily:"var(--font-sans)",fontSize:13,fontWeight:500,cursor:"pointer"}}>Watchlist ({Object.keys(watchlist).length})</button>
            <div style={{flex:1}}/>
            <input value={searchText} onChange={e=>setSearchText(e.target.value)} placeholder="Search company, ticker, headline..." style={{background:"var(--bg-surface)",border:"1px solid var(--border)",borderRadius:8,padding:"8px 14px",color:"var(--text-primary)",fontFamily:"var(--font-sans)",fontSize:13,outline:"none",minWidth:200,maxWidth:300}}/>
            <button onClick={()=>setConfigOpen(!configOpen)} style={{padding:"8px 14px",border:"1px solid var(--border)",borderRadius:8,background:"transparent",color:"var(--text-muted)",fontFamily:"var(--font-mono)",fontSize:11,cursor:"pointer"}}>&#9881;</button>
          </div>
          {configOpen&&<div className="fade-up" style={{marginTop:4,marginBottom:12,padding:16,background:"var(--bg-card)",border:"1px solid var(--border)",borderRadius:10}}>
            <label style={{fontSize:12,color:"var(--text-muted)",display:"block",marginBottom:6}}>Backend URL</label>
            <div style={{display:"flex",gap:8}}>
              <input value={backendUrl} onChange={e=>setBackendUrl(e.target.value)} style={{flex:1,background:"var(--bg-surface)",border:"1px solid var(--border)",borderRadius:6,padding:"8px 12px",color:"var(--text-primary)",fontFamily:"var(--font-mono)",fontSize:12,outline:"none"}}/>
              <button onClick={()=>{fetchData();setConfigOpen(false);}} style={{padding:"8px 14px",background:"var(--accent)",color:"var(--bg-primary)",border:"none",borderRadius:6,fontFamily:"var(--font-sans)",fontSize:12,fontWeight:600,cursor:"pointer"}}>Connect</button>
            </div>
          </div>}
        </header>

        {data&&<div className="fade-up" style={{display:"flex",gap:16,marginBottom:24,flexWrap:"wrap"}}>
          {[{l:"Today (cached)",v:data.total_raw,c:"var(--text-muted)"},{l:"Showing",v:anns.length,c:"var(--text-secondary)"},{l:"Watchlist",v:wlCount,c:"var(--watchlist)"},{l:"Sector",v:secCount,c:"var(--accent)"}].map(s=>
            <div key={s.l} style={{padding:"12px 18px",background:"var(--bg-card)",border:"1px solid var(--border)",borderRadius:10,minWidth:100}}>
              <div style={{fontFamily:"var(--font-mono)",fontSize:22,fontWeight:600,color:s.c}}>{s.v}</div>
              <div style={{fontSize:11,color:"var(--text-muted)",marginTop:2}}>{s.l}</div>
            </div>)}
        </div>}

        <div style={{display:"flex",gap:8,marginBottom:12,flexWrap:"wrap",alignItems:"center"}}>
          <FilterPill label="All" active={filter==="all"} onClick={()=>setFilter("all")} count={allAnns.length}/>
          <FilterPill label="Watchlist" active={filter==="watchlist"} onClick={()=>setFilter("watchlist")} count={wlCount}/>
          <FilterPill label="Sector relevant" active={filter==="sector"} onClick={()=>setFilter("sector")} count={secCount}/>
          <span style={{width:1,background:"var(--border)",alignSelf:"stretch",margin:"4px 4px"}}/>
          <FilterPill label="&#9650; Relevance" active={sortMode==="relevance"} onClick={()=>setSortMode("relevance")}/>
          <FilterPill label="&#9660; Latest first" active={sortMode==="latest"} onClick={()=>setSortMode("latest")}/>
        </div>
        <div style={{display:"flex",gap:8,marginBottom:20,flexWrap:"wrap"}}>
          <FilterPill label="All types" active={categoryFilter==="all"} onClick={()=>setCategoryFilter("all")}/>
          {sortedCats.map(cat=><FilterPill key={cat} label={cat} active={categoryFilter===cat} onClick={()=>setCategoryFilter(cat===categoryFilter?"all":cat)} count={catCounts[cat]}/>)}
        </div>

        {data?.errors?.length>0&&<div style={{marginBottom:16,padding:"10px 16px",background:"rgba(239,68,68,0.08)",border:"1px solid rgba(239,68,68,0.2)",borderRadius:8,fontSize:12,color:"var(--danger)"}}>{data.errors.map((e,i)=><div key={i}>{e}</div>)}</div>}

        {status==="error"&&!data&&<div className="fade-up" style={{textAlign:"center",padding:"60px 20px",background:"var(--bg-card)",border:"1px solid var(--border)",borderRadius:14}}>
          <div style={{fontSize:36,marginBottom:16}}>&#9889;</div>
          <div style={{fontSize:16,fontWeight:600,marginBottom:8}}>Can't reach the backend</div>
          <div style={{fontSize:13,color:"var(--text-muted)",marginBottom:20,lineHeight:1.6}}>Server should be running at <code style={{fontFamily:"var(--font-mono)",color:"var(--accent)"}}>{backendUrl}</code></div>
          <div style={{background:"var(--bg-surface)",border:"1px solid var(--border)",borderRadius:8,padding:16,display:"inline-block",textAlign:"left"}}>
            <code style={{fontFamily:"var(--font-mono)",fontSize:12,color:"var(--text-secondary)",lineHeight:1.8,display:"block"}}>cd backend<br/>pip install -r requirements.txt<br/>python server.py</code>
          </div>
        </div>}

        {status==="loading"&&!data&&<div style={{display:"flex",flexDirection:"column",gap:10}}>{[0,1,2,3,4].map(i=><SkeletonCard key={i} index={i}/>)}</div>}

        {anns.length>0&&<div style={{display:"flex",flexDirection:"column",gap:10}}>
          {anns.map((a,i)=><AnnouncementCard key={`${a.company}-${a.headline}-${i}`} ann={a} index={i} backendUrl={backendUrl}/>)}
        </div>}

        {data&&anns.length===0&&<div className="fade-up" style={{textAlign:"center",padding:"60px 20px",background:"var(--bg-card)",border:"1px solid var(--border)",borderRadius:14}}>
          <div style={{fontSize:36,marginBottom:16}}>&#128237;</div>
          <div style={{fontSize:16,fontWeight:600,marginBottom:6}}>No announcements match your filters</div>
          <div style={{fontSize:13,color:"var(--text-muted)"}}>Try broadening your filters or check back later.</div>
        </div>}

        <footer style={{marginTop:40,paddingTop:20,borderTop:"1px solid var(--border)",display:"flex",justifyContent:"space-between",fontSize:11,color:"var(--text-muted)",flexWrap:"wrap",gap:8}}>
          <span>h2Radnor Capital Markets · 68 King William Street, London</span>
          <span>Source: Investegate · Not investment advice</span>
        </footer>

        {showWatchlist&&<WatchlistModal watchlist={watchlist} onClose={()=>setShowWatchlist(false)} onAdd={handleAdd} onRemove={handleRemove}/>}
      </div>;
    }
    ReactDOM.render(<App/>,document.getElementById("root"));
  </script>
</body>
</html>
